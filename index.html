  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
  <script>
    const files = {"app.py": "\"\"\"\napp.py\n台灣天氣預報 Web 應用程式 (Taiwan Weather Forecast Dashboard)\n現代美學旗艦版 (Modern Glassmorphic Visual Upgrade)\n- 整合中央氣象署 CWA API (F-C0032-001)\n- SQLite (data.db) 輕量資料庫快取\n- 現代玻璃擬態 (Glassmorphic) 儀表板視覺\n- Plotly 平滑漸層氣溫趨勢折線圖 & 跨縣市對比\n- Folium 全台 22 縣市互動氣溫地圖\n- AI 智慧生活決策顧問 (穿搭/雨具/出遊/播報)\n- 全台即時極端氣候與防災預警提示\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nfrom datetime import datetime\nfrom streamlit_folium import st_folium\n\n# 引入自訂模組\nfrom database import init_db, get_all_regions, get_forecast_by_region, get_all_forecasts\nfrom fetch_weather import update_weather_pipeline\nfrom components.charts import create_temperature_trend_chart, create_multi_region_comparison_chart\nfrom components.map_view import create_taiwan_weather_map\nfrom components.ai_advisor import generate_weather_advice\nfrom components.alerts import scan_weather_alerts\n\n# 1. 頁面配置\nst.set_page_config(\n    page_title=\"Taiwan Weather Dashboard | 台灣即時氣象儀表板\",\n    page_icon=\"🌤️\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# 注入頂級現代風格 CSS (Google Fonts + Glassmorphism + Micro-animations)\nst.markdown(\n    \"\"\"\n    <style>\n    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');\n\n    html, body, [class*=\"css\"] {\n        font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;\n    }\n\n    /* 隱藏預設 Streamlit 冗餘頂部間距 */\n    .block-container {\n        padding-top: 1.8rem;\n        padding-bottom: 3rem;\n        max-width: 1300px;\n    }\n\n    /* 頂部 Hero 漸層標題區塊 */\n    .hero-container {\n        background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(241, 245, 249, 0.7) 100%);\n        backdrop-filter: blur(16px);\n        border: 1px solid rgba(226, 232, 240, 0.8);\n        border-radius: 20px;\n        padding: 24px 28px;\n        margin-bottom: 22px;\n        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.02);\n    }\n\n    .hero-badge {\n        display: inline-flex;\n        align-items: center;\n        gap: 6px;\n        background: #F0FDF4;\n        border: 1px solid #BBF7D0;\n        color: #166534;\n        padding: 4px 12px;\n        border-radius: 30px;\n        font-size: 0.8rem;\n        font-weight: 700;\n        letter-spacing: 0.04em;\n        margin-bottom: 10px;\n    }\n\n    .pulse-dot {\n        width: 8px;\n        height: 8px;\n        background-color: #22C55E;\n        border-radius: 50%;\n        display: inline-block;\n        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);\n        animation: pulse 2s infinite;\n    }\n\n    @keyframes pulse {\n        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }\n        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }\n        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }\n    }\n\n    .hero-title {\n        font-size: 2.3rem;\n        font-weight: 800;\n        background: linear-gradient(135deg, #0F172A 0%, #0369A1 50%, #4F46E5 100%);\n        -webkit-background-clip: text;\n        -webkit-text-fill-color: transparent;\n        line-height: 1.2;\n        margin: 0;\n    }\n\n    .hero-subtitle {\n        font-size: 0.98rem;\n        color: #64748B;\n        margin-top: 6px;\n        line-height: 1.5;\n    }\n\n    /* 現代玻璃擬態指標卡片 (Metric Cards) */\n    .metric-card-modern {\n        background: #FFFFFF;\n        border: 1px solid #E2E8F0;\n        border-radius: 16px;\n        padding: 20px 22px;\n        position: relative;\n        overflow: hidden;\n        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.02);\n        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n    }\n\n    .metric-card-modern:hover {\n        transform: translateY(-4px);\n        box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.03);\n    }\n\n    .card-top-accent {\n        position: absolute;\n        top: 0;\n        left: 0;\n        right: 0;\n        height: 4px;\n    }\n\n    .metric-header-row {\n        display: flex;\n        align-items: center;\n        justify-content: space-between;\n        margin-bottom: 8px;\n    }\n\n    .metric-label-clean {\n        font-size: 0.82rem;\n        font-weight: 700;\n        color: #64748B;\n        text-transform: uppercase;\n        letter-spacing: 0.06em;\n    }\n\n    .metric-icon-bubble {\n        width: 38px;\n        height: 38px;\n        border-radius: 10px;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-size: 1.25rem;\n    }\n\n    .metric-value-huge {\n        font-size: 2.1rem;\n        font-weight: 800;\n        color: #0F172A;\n        line-height: 1.1;\n    }\n\n    .metric-desc {\n        font-size: 0.82rem;\n        color: #94A3B8;\n        margin-top: 6px;\n    }\n\n    /* 氣象警報膠囊 */\n    .alert-banner-box {\n        background: #FFF1F2;\n        border: 1px solid #FFE4E6;\n        border-left: 5px solid #F43F5E;\n        border-radius: 12px;\n        padding: 14px 18px;\n        margin-bottom: 18px;\n    }\n\n    /* 側邊欄精緻按鈕與元件 */\n    .stButton>button {\n        background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);\n        color: white;\n        border: none;\n        border-radius: 10px;\n        font-weight: 600;\n        padding: 10px 18px;\n        transition: all 0.2s ease;\n        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);\n    }\n\n    .stButton>button:hover {\n        background: linear-gradient(135deg, #0369A1 0%, #1D4ED8 100%);\n        transform: translateY(-1px);\n        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);\n    }\n    </style>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n\n@st.cache_data(ttl=600)\ndef load_all_forecast_data() -> pd.DataFrame:\n    \"\"\"步驟 12 & 20：從 SQLite 資料庫讀取全部預報資料 (快取 10 分鐘)\"\"\"\n    init_db()\n    df = get_all_forecasts()\n    if df.empty:\n        update_weather_pipeline()\n        df = get_all_forecasts()\n    return df\n\n\n@st.cache_data(ttl=600)\ndef load_regions_list() -> list:\n    \"\"\"步驟 10 & 13：取得縣市清單\"\"\"\n    init_db()\n    regions = get_all_regions()\n    if not regions:\n        update_weather_pipeline()\n        regions = get_all_regions()\n    return regions\n\n\n# 載入資料\nall_forecasts_df = load_all_forecast_data()\nregions = load_regions_list()\n\n# 側邊欄控制項 (步驟 13)\nwith st.sidebar:\n    st.markdown(\n        \"\"\"\n        <div style=\"text-align: center; margin-bottom: 12px;\">\n            <div style=\"font-size: 2.6rem;\">🌤️</div>\n            <div style=\"font-size: 1.15rem; font-weight: 800; color: #0F172A;\">Taiwan Weather</div>\n            <div style=\"font-size: 0.8rem; color: #64748B;\">Central Weather Administration</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n    st.markdown(\"---\")\n\n    # 縣市選擇下拉選單\n    default_index = regions.index(\"臺北市\") if \"臺北市\" in regions else 0\n    selected_region = st.selectbox(\n        \"📍 觀測目標縣市 (Select Region)：\",\n        options=regions,\n        index=default_index,\n        help=\"切換欲檢視之縣市氣象預報\",\n    )\n\n    st.markdown(\"<div style='height: 10px;'></div>\", unsafe_allow_html=True)\n    \n    # 一鍵更新按鈕\n    st.subheader(\"🔄 氣象資料同步\")\n    if st.button(\"立即從氣象署更新資料\", use_container_width=True):\n        with st.spinner(\"正在向中央氣象署 API 請求最新數據並寫入資料庫...\"):\n            try:\n                update_weather_pipeline()\n                st.cache_data.clear()\n                st.success(\"✅ 更新成功！\")\n                st.rerun()\n            except Exception as e:\n                st.error(f\"❌ 更新失敗: {e}\")\n\n    st.markdown(\"---\")\n    st.markdown(\n        \"\"\"\n        <div style=\"background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px; font-size: 0.85rem; color: #475569;\">\n            <div style=\"font-weight: 700; color: #0F172A; margin-bottom: 4px;\">🛠️ 技術棧規格</div>\n            <div>• CWA API (F-C0032-001)</div>\n            <div>• SQLite (data.db)</div>\n            <div>• Streamlit & Plotly</div>\n            <div>• Folium 地理圖資</div>\n            <div>• Antigravity × Gemini</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\n# 主頁面頂部現代 Hero 標題區\nlast_updated = all_forecasts_df[\"updated_at\"].max() if (not all_forecasts_df.empty and \"updated_at\" in all_forecasts_df.columns) else datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\nst.markdown(\n    f\"\"\"\n    <div class=\"hero-container\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;\">\n            <div class=\"hero-badge\">\n                <span class=\"pulse-dot\"></span>\n                <span>即時開放氣象資料連線中 · CWA Open Data</span>\n            </div>\n            <div style=\"font-size: 0.82rem; color: #64748B; background: #FFFFFF; border: 1px solid #E2E8F0; padding: 4px 12px; border-radius: 20px;\">\n                🕒 資料庫同步時間：{last_updated}\n            </div>\n        </div>\n        <h1 class=\"hero-title\">台灣天氣預報儀表板</h1>\n        <div class=\"hero-subtitle\">\n            全台 22 縣市即時氣候觀測、溫度區間走勢分析、Folium 地理圖資標註與 AI 生活決策顧問 ｜ 目前焦點：<b style=\"color: #0284C7; font-size: 1.05rem;\">{selected_region}</b>\n        </div>\n    </div>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n# 步驟 22 防災應用：極端天氣警報提示\nalerts = scan_weather_alerts(all_forecasts_df)\nif alerts:\n    with st.expander(f\"⚠️ 全台即時氣候與防災預警提示 (共偵測到 {len(alerts)} 筆重點警示)\", expanded=False):\n        alert_cols = st.columns(min(3, len(alerts)))\n        for idx, alt in enumerate(alerts[:3]):\n            with alert_cols[idx]:\n                st.markdown(\n                    f\"\"\"\n                    <div style=\"background:#FFF1F2; border-left:4px solid {alt['color']}; padding:10px 14px; border-radius:8px; margin-bottom:6px;\">\n                        <div style=\"font-weight:700; color:#9F1239; font-size:0.92rem;\">{alt['title']}</div>\n                        <div style=\"font-size:0.83rem; color:#4C0519; margin-top:3px; line-height:1.4;\">{alt['description']}</div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True,\n                )\n\n# 取得選定縣市的預報資料\nregion_df = all_forecasts_df[all_forecasts_df[\"regionName\"] == selected_region].reset_index(drop=True)\n\nif not region_df.empty:\n    latest_slot = region_df.iloc[0]\n\n    # 步驟 16：頂部現代玻璃擬態指標卡片 (Metric Cards)\n    m1, m2, m3, m4 = st.columns(4)\n    with m1:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card-modern\">\n                <div class=\"card-top-accent\" style=\"background: linear-gradient(90deg, #F43F5E, #FB7185);\"></div>\n                <div class=\"metric-header-row\">\n                    <span class=\"metric-label-clean\">最高氣溫 (MaxT)</span>\n                    <div class=\"metric-icon-bubble\" style=\"background: #FFE4E6; color: #E11D48;\">☀️</div>\n                </div>\n                <div class=\"metric-value-huge\" style=\"color: #E11D48;\">{latest_slot['maxT']} <span style=\"font-size: 1.2rem; font-weight: 600;\">°C</span></div>\n                <div class=\"metric-desc\">預報時段極端高溫上限</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n    with m2:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card-modern\">\n                <div class=\"card-top-accent\" style=\"background: linear-gradient(90deg, #0EA5E9, #38BDF8);\"></div>\n                <div class=\"metric-header-row\">\n                    <span class=\"metric-label-clean\">最低氣溫 (MinT)</span>\n                    <div class=\"metric-icon-bubble\" style=\"background: #E0F2FE; color: #0284C7;\">❄️</div>\n                </div>\n                <div class=\"metric-value-huge\" style=\"color: #0284C7;\">{latest_slot['minT']} <span style=\"font-size: 1.2rem; font-weight: 600;\">°C</span></div>\n                <div class=\"metric-desc\">預報時段晨間低溫下限</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n    with m3:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card-modern\">\n                <div class=\"card-top-accent\" style=\"background: linear-gradient(90deg, #F59E0B, #FBBF24);\"></div>\n                <div class=\"metric-header-row\">\n                    <span class=\"metric-label-clean\">預報天氣現象</span>\n                    <div class=\"metric-icon-bubble\" style=\"background: #FEF3C7; color: #D97706;\">🌤️</div>\n                </div>\n                <div class=\"metric-value-huge\" style=\"font-size: 1.6rem; color: #0F172A; line-height: 1.4;\">{latest_slot['weatherCondition']}</div>\n                <div class=\"metric-desc\">天空雲量與預報現象</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n    with m4:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card-modern\">\n                <div class=\"card-top-accent\" style=\"background: linear-gradient(90deg, #0284C7, #38BDF8);\"></div>\n                <div class=\"metric-header-row\">\n                    <span class=\"metric-label-clean\">降雨機率 (PoP)</span>\n                    <div class=\"metric-icon-bubble\" style=\"background: #E0F2FE; color: #0369A1;\">💧</div>\n                </div>\n                <div class=\"metric-value-huge\" style=\"color: #0369A1;\">{latest_slot['rainProbability']} <span style=\"font-size: 1.2rem; font-weight: 600;\">%</span></div>\n                <div class=\"metric-desc\">降水機率指標</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    st.markdown(\"<div style='height: 18px;'></div>\", unsafe_allow_html=True)\n\n    # 頁籤分頁設計 (步驟 14, 15, 17~19, 22)\n    tab_chart, tab_map, tab_ai, tab_table = st.tabs([\n        \"📈 氣溫趨勢分析 (折線圖)\",\n        \"🗺️ 台灣互動氣象地圖 (Folium)\",\n        \"🤖 AI 智慧生活決策顧問\",\n        \"📋 詳細預報資料表\",\n    ])\n\n    with tab_chart:\n        st.markdown(f\"#### 📊 {selected_region} 未來時段氣溫預測走勢\")\n        chart_fig = create_temperature_trend_chart(region_df, selected_region)\n        st.plotly_chart(chart_fig, use_container_width=True)\n\n        st.info(\"💡 **趨勢觀察提示**：藍色與紅色節點分別為各時段低溫與高溫，陰影區塊呈現氣溫振幅範圍，滑鼠懸停於節點可檢視精確數值。\")\n\n        # 步驟 22 延伸應用：多縣市氣溫對比\n        st.markdown(\"---\")\n        st.markdown(\"#### 🔄 跨縣市氣溫綜合對比分析\")\n        st.caption(\"挑選多個縣市，比較不同地區最高氣溫變化走勢。\")\n        default_compare = [selected_region] + [r for r in [\"臺北市\", \"臺中市\", \"高雄市\"] if r != selected_region][:2]\n        compare_regions = st.multiselect(\n            \"選擇要比較的縣市清單 (可多選)：\",\n            options=regions,\n            default=default_compare,\n            key=\"multi_compare_select\",\n        )\n        if compare_regions:\n            comp_fig = create_multi_region_comparison_chart(all_forecasts_df, compare_regions)\n            st.plotly_chart(comp_fig, use_container_width=True)\n\n    with tab_map:\n        st.markdown(\"#### 🗺️ 全台灣縣市即時氣溫地理分佈圖\")\n        st.caption(\"點擊地圖上的各縣市圓形氣溫標記，可展開該縣市的天氣現象與降雨機率卡片。\")\n        \n        folium_map = create_taiwan_weather_map(all_forecasts_df, selected_region=selected_region)\n        st_folium(folium_map, width=\"100%\", height=530, returned_objects=[])\n\n    with tab_ai:\n        st.markdown(f\"#### 🤖 {selected_region} AI 智慧生活決策顧問 (步驟 22 延伸應用)\")\n        st.caption(\"結合最新氣象要素，為您自動推算今日穿搭、雨具需求、戶外休閒建議與擬真主播摘要。\")\n\n        advice = generate_weather_advice(\n            selected_region,\n            float(latest_slot[\"minT\"]),\n            float(latest_slot[\"maxT\"]),\n            str(latest_slot[\"weatherCondition\"]),\n            int(latest_slot[\"rainProbability\"]),\n        )\n\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\n                f\"\"\"\n                <div style=\"background:#FFFFFF; border:1px solid #E2E8F0; border-left:4px solid {advice['clothing_color']}; padding:18px; border-radius:12px; margin-bottom:14px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.03);\">\n                    <div style=\"font-weight:700; font-size:1.05rem; color:#0F172A;\">👔 今日穿搭指南 · <span style=\"color:{advice['clothing_color']}; font-weight:800;\">{advice['clothing_level']}</span></div>\n                    <div style=\"margin-top:8px; color:#475569; font-size:0.95rem; line-height:1.6;\">{advice['clothing_advice']}</div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n            st.markdown(\n                f\"\"\"\n                <div style=\"background:#FFFFFF; border:1px solid #E2E8F0; border-left:4px solid #0284c7; padding:18px; border-radius:12px; margin-bottom:14px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.03);\">\n                    <div style=\"font-weight:700; font-size:1.05rem; color:#0F172A;\">☂️ 雨具攜帶提醒 · <span>{advice['umbrella_badge']}</span></div>\n                    <div style=\"margin-top:8px; color:#475569; font-size:0.95rem; line-height:1.6;\">{advice['umbrella_advice']}</div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n        with c2:\n            st.markdown(\n                f\"\"\"\n                <div style=\"background:#FFFFFF; border:1px solid #E2E8F0; border-left:4px solid #10b981; padding:18px; border-radius:12px; margin-bottom:14px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.03);\">\n                    <div style=\"font-weight:700; font-size:1.05rem; color:#0F172A;\">🏃 戶外休閒適宜度 · <span style=\"color:#059669; font-weight:800;\">{advice['activity_status']}</span></div>\n                    <div style=\"margin-top:8px; color:#475569; font-size:0.95rem; line-height:1.6;\">{advice['activity_advice']}</div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n            st.markdown(\n                f\"\"\"\n                <div style=\"background:linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%); border:1px solid #CBD5E1; padding:16px; border-radius:12px;\">\n                    <div style=\"font-weight:700; font-size:0.95rem; color:#334155; margin-bottom:6px;\">🎙️ AI 天氣主播播報稿</div>\n                    <div style=\"font-style:italic; color:#475569; font-size:0.92rem; line-height:1.6;\">\"{advice['broadcast_script']}\"</div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n        st.markdown(\"---\")\n        st.markdown(\"##### 🌟 全台好天氣出遊推薦榜 (低降雨機率精選 TOP 5)\")\n        latest_all = all_forecasts_df.groupby(\"regionName\").first().reset_index()\n        top_destinations = latest_all.sort_values(by=[\"rainProbability\", \"maxT\"], ascending=[True, False]).head(5)\n\n        top_cols = st.columns(len(top_destinations))\n        for idx, (_, row) in enumerate(top_destinations.iterrows()):\n            with top_cols[idx]:\n                st.metric(\n                    label=f\"TOP {idx+1} {row['regionName']}\",\n                    value=f\"{row['maxT']}°C\",\n                    delta=f\"降雨率 {row['rainProbability']}%\",\n                    delta_color=\"inverse\",\n                )\n\n    with tab_table:\n        st.markdown(f\"#### 📋 {selected_region} 預報明細數據表格 (步驟 15)\")\n        \n        display_df = region_df.rename(\n            columns={\n                \"regionName\": \"縣市名稱\",\n                \"validDate\": \"預報有效時段\",\n                \"minT\": \"最低溫 (°C)\",\n                \"maxT\": \"最高溫 (°C)\",\n                \"weatherCondition\": \"天氣現象\",\n                \"rainProbability\": \"降雨機率 (%)\",\n                \"updated_at\": \"記錄更新時間\",\n            }\n        )\n        st.dataframe(display_df, use_container_width=True, hide_index=True)\n        \n        # 步驟 22 延伸應用：資料匯出下載\n        csv_data = display_df.to_csv(index=False).encode(\"utf-8-sig\")\n        st.download_button(\n            label=f\"📥 下載 {selected_region} 預報資料 (CSV)\",\n            data=csv_data,\n            file_name=f\"{selected_region}_weather_forecast.csv\",\n            mime=\"text/csv\",\n            help=\"匯出包含預報有效時段、氣溫、降雨機率與天氣現象之 CSV 表格 (UTF-8 編碼相容 Excel)\",\n        )\n\nelse:\n    st.warning(\"⚠️ 尚無該地區之預報數據，請點擊左側「立即從氣象署更新資料」按鈕。\")\n\n# 頁尾\nst.markdown(\"---\")\nst.markdown(\n    \"\"\"\n    <div style=\"text-align: center; color: #94A3B8; font-size: 0.85rem; padding: 10px 0;\">\n        Taiwan Weather Forecast Dashboard | Built with Streamlit, Plotly & Folium | AI × Coding Vibe Coding\n    </div>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n# Vercel Serverless Python Runtime 相容導出 (避免 Vercel 尋找 app/handler 報錯)\ndef handler(request=None, *args, **kwargs):\n    return {\n        \"statusCode\": 200,\n        \"headers\": {\"Content-Type\": \"text/plain; charset=utf-8\"},\n        \"body\": \"Taiwan Weather Forecast Dashboard is online. Frontend is served via index.html (Stlite Wasm).\",\n    }\n\napp = handler\napplication = handler\n", "database.py": "\"\"\"\ndatabase.py\nSQLite 資料庫操作模組 (遵循課程步驟 8、9、10)\n負責建立資料庫表、儲存氣溫預報資料及提供查詢介面\n\"\"\"\n\nimport sqlite3\nimport pandas as pd\nfrom typing import List, Dict, Optional\n\nDB_FILE = \"data.db\"\n\n\ndef get_connection(db_path: str = DB_FILE) -> sqlite3.Connection:\n    \"\"\"取得 SQLite 資料庫連線\"\"\"\n    conn = sqlite3.connect(db_path)\n    conn.row_factory = sqlite3.Row\n    return conn\n\n\ndef init_db(db_path: str = DB_FILE) -> None:\n    \"\"\"\n    步驟 8 & 9：建立 SQLite 資料庫與 TemperatureForecasts 資料表\n    \"\"\"\n    conn = get_connection(db_path)\n    try:\n        cursor = conn.cursor()\n        cursor.execute(\n            \"\"\"\n            CREATE TABLE IF NOT EXISTS TemperatureForecasts (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n                regionName TEXT NOT NULL,\n                validDate TEXT NOT NULL,\n                minT REAL,\n                maxT REAL,\n                weatherCondition TEXT,\n                rainProbability INTEGER,\n                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n                UNIQUE(regionName, validDate) ON CONFLICT REPLACE\n            );\n            \"\"\"\n        )\n        conn.commit()\n    finally:\n        conn.close()\n\n\ndef save_forecasts(data_list: List[Dict], db_path: str = DB_FILE) -> int:\n    \"\"\"\n    將整理後的氣象預報資料寫入 SQLite 資料庫 (支援 UPSERT 避免重複)\n    \"\"\"\n    init_db(db_path)\n    conn = get_connection(db_path)\n    sql = \"\"\"\n        INSERT INTO TemperatureForecasts (\n            regionName, validDate, minT, maxT, weatherCondition, rainProbability, updated_at\n        ) VALUES (\n            :regionName, :validDate, :minT, :maxT, :weatherCondition, :rainProbability, CURRENT_TIMESTAMP\n        );\n    \"\"\"\n    try:\n        cursor = conn.cursor()\n        cursor.executemany(sql, data_list)\n        conn.commit()\n        return cursor.rowcount\n    finally:\n        conn.close()\n\n\ndef get_all_regions(db_path: str = DB_FILE) -> List[str]:\n    \"\"\"\n    步驟 10 範例：查詢所有縣市清單\n    SELECT DISTINCT regionName FROM TemperatureForecasts;\n    \"\"\"\n    init_db(db_path)\n    conn = get_connection(db_path)\n    try:\n        cursor = conn.cursor()\n        cursor.execute(\"SELECT DISTINCT regionName FROM TemperatureForecasts ORDER BY id ASC;\")\n        rows = cursor.fetchall()\n        return [row[\"regionName\"] for row in rows]\n    finally:\n        conn.close()\n\n\ndef get_forecast_by_region(region_name: str, db_path: str = DB_FILE) -> pd.DataFrame:\n    \"\"\"\n    步驟 10 範例：查詢特定縣市的預報資料\n    SELECT * FROM TemperatureForecasts WHERE regionName = ?;\n    \"\"\"\n    init_db(db_path)\n    conn = get_connection(db_path)\n    query = \"\"\"\n        SELECT regionName, validDate, minT, maxT, weatherCondition, rainProbability, updated_at\n        FROM TemperatureForecasts\n        WHERE regionName = ?\n        ORDER BY id ASC;\n    \"\"\"\n    try:\n        df = pd.read_sql_query(query, conn, params=(region_name,))\n        return df\n    finally:\n        conn.close()\n\n\ndef get_all_forecasts(db_path: str = DB_FILE) -> pd.DataFrame:\n    \"\"\"\n    查詢全台灣所有縣市的最新預報資料\n    \"\"\"\n    init_db(db_path)\n    conn = get_connection(db_path)\n    query = \"\"\"\n        SELECT regionName, validDate, minT, maxT, weatherCondition, rainProbability, updated_at\n        FROM TemperatureForecasts\n        ORDER BY id ASC;\n    \"\"\"\n    try:\n        df = pd.read_sql_query(query, conn)\n        return df\n    finally:\n        conn.close()\n\n\nif __name__ == \"__main__\":\n    init_db()\n    print(\"SQLite 資料庫初始化成功！資料表 TemperatureForecasts 已就緒。\")\n", "fetch_weather.py": "\"\"\"\nfetch_weather.py\n中央氣象署 (CWA) 氣象資料擷取與處理模組\n對應教學步驟：\n- 步驟 4: 使用 Requests 取得 JSON 資料\n- 步驟 5: JSON 資料結構解析\n- 步驟 6: 提取最高溫、最低溫、天氣現象與降雨機率\n- 步驟 7: 使用 Pandas 整理資料與預覽\n- 步驟 8 & 9: 寫入 SQLite 資料庫 (data.db)\n- 步驟 10: 執行 SQL 查詢驗證成果\n\"\"\"\n\nimport os\nimport sys\nimport urllib3\nimport requests\nimport pandas as pd\nfrom dotenv import load_dotenv\n\n# 支援 Pyodide / WebAssembly (Wasm / Vercel Stlite) 瀏覽器 HTTP 請求\ntry:\n    import pyodide_http\n    pyodide_http.patch_all()\nexcept Exception:\n    pass\n\n# 避免 Windows 終端機 (cp950) 輸出 UTF-8 / Emoji 編碼異常\nif hasattr(sys.stdout, \"reconfigure\"):\n    try:\n        sys.stdout.reconfigure(encoding=\"utf-8\")\n    except Exception:\n        pass\n\n# 引入自訂資料庫模組\nfrom database import init_db, save_forecasts, get_all_regions, get_forecast_by_region\n\n# 忽略不安全的 SSL 警告 (適應中央氣象署主機與 Python 3.14 憑證鏈檢查)\nurllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n\n# 載入 .env 環境變數\nload_dotenv()\n\n# 中央氣象署 API 金鑰 (優先讀取環境變數，若無則使用預設)\nDEFAULT_API_KEY = \"CWA-8C2E2368-812D-4F61-8F55-8AFC60837532\"\nAPI_KEY = os.getenv(\"CWA_API_KEY\", DEFAULT_API_KEY).strip()\n\n# 中央氣象署 今明 36 小時天氣預報 API 網址 (代號: F-C0032-001)\nCWA_API_URL = \"https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001\"\n\n\ndef fetch_cwa_weather_json(api_key: str = API_KEY) -> dict:\n    \"\"\"\n    步驟 4：使用 Requests 向中央氣象署 API 取得 JSON 資料\n    \"\"\"\n    print(\"[INFO] 正在向中央氣象署請求天氣預報資料 (F-C0032-001)...\")\n    params = {\n        \"Authorization\": api_key,\n        \"format\": \"JSON\"\n    }\n\n    try:\n        response = requests.get(CWA_API_URL, params=params, verify=False, timeout=15)\n        response.raise_for_status()\n        data = response.json()\n\n        if not data.get(\"success\") or \"records\" not in data:\n            raise ValueError(f\"API 回傳資料格式異常或授權失敗: {data}\")\n\n        print(\"[SUCCESS] 成功取得氣象原始 JSON 資料！\")\n        return data\n\n    except requests.exceptions.RequestException as e:\n        print(f\"[ERROR] 網路請求失敗: {e}\", file=sys.stderr)\n        raise\n\n\ndef parse_weather_elements(raw_json: dict) -> pd.DataFrame:\n    \"\"\"\n    步驟 5 & 6 & 7：\n    - 解析 JSON 資料結構 (records -> location -> weatherElement)\n    - 提取各縣市、時段、最高溫 (MaxT)、最低溫 (MinT)、天氣現象 (Wx)、降雨機率 (PoP)\n    - 使用 Pandas 整理為乾淨的結構化 DataFrame\n    \"\"\"\n    print(\"[INFO] 正在解析 JSON 資料結構並清洗數據...\")\n    locations = raw_json[\"records\"][\"location\"]\n    records_list = []\n\n    for loc in locations:\n        region_name = loc[\"locationName\"]\n        elements = loc[\"weatherElement\"]\n\n        # 將 weatherElement 依 elementName 建立字典對照\n        element_dict = {elem[\"elementName\"]: elem[\"time\"] for elem in elements}\n\n        # 各時段時間長度 (通常為 3 個時段)\n        time_slots = len(element_dict.get(\"Wx\", []))\n\n        for idx in range(time_slots):\n            # 取得該時段起訖時間\n            time_info = element_dict[\"Wx\"][idx]\n            start_time = time_info[\"startTime\"]\n            end_time = time_info[\"endTime\"]\n            valid_date = f\"{start_time} ~ {end_time}\"\n\n            # 提取天氣現象 (Wx)\n            wx = element_dict.get(\"Wx\", [])[idx][\"parameter\"][\"parameterName\"]\n\n            # 提取降雨機率 (PoP)\n            pop_str = element_dict.get(\"PoP\", [])[idx][\"parameter\"][\"parameterName\"]\n            pop = int(pop_str) if pop_str.isdigit() else 0\n\n            # 提取最低溫 (MinT)\n            mint_str = element_dict.get(\"MinT\", [])[idx][\"parameter\"][\"parameterName\"]\n            min_t = float(mint_str) if mint_str else None\n\n            # 提取最高溫 (MaxT)\n            maxt_str = element_dict.get(\"MaxT\", [])[idx][\"parameter\"][\"parameterName\"]\n            max_t = float(maxt_str) if maxt_str else None\n\n            records_list.append({\n                \"regionName\": region_name,\n                \"validDate\": valid_date,\n                \"minT\": min_t,\n                \"maxT\": max_t,\n                \"weatherCondition\": wx,\n                \"rainProbability\": pop\n            })\n\n    # 轉為 Pandas DataFrame\n    df = pd.DataFrame(records_list)\n    print(f\"[SUCCESS] 解析完成！共提取 {len(df)} 筆預報紀錄（涵蓋全台 {len(locations)} 個縣市）。\")\n    return df\n\n\ndef update_weather_pipeline():\n    \"\"\"\n    整合完整資料處理流程：\n    1. 取得 API 資料\n    2. 解析與轉為 DataFrame\n    3. 存入 SQLite 資料庫 (data.db)\n    4. 驗證資料庫內容\n    \"\"\"\n    # 1. 抓取資料\n    raw_data = fetch_cwa_weather_json()\n\n    # 2. 解析資料為 DataFrame (步驟 6 & 7)\n    df = parse_weather_elements(raw_data)\n\n    print(\"\\n--- 【步驟 7：Pandas 資料預覽 (前 6 筆)】 ---\")\n    print(df.head(6).to_string(index=False))\n    print(\"-\" * 60)\n\n    # 3. 寫入 SQLite 資料庫 (步驟 8 & 9)\n    print(\"\\n[INFO] 正在將資料寫入 SQLite 資料庫 (data.db)...\")\n    init_db()\n    data_to_insert = df.to_dict(orient=\"records\")\n    saved_count = save_forecasts(data_to_insert)\n    print(f\"[SUCCESS] 成功寫入/更新 SQLite 資料表 `TemperatureForecasts`！(共處理 {len(data_to_insert)} 筆)\")\n\n    # 4. 執行 SQL 查詢測試 (步驟 10)\n    print(\"\\n--- 【步驟 10：SQL 查詢測試舉例】 ---\")\n    regions = get_all_regions()\n    print(f\"全台已有預報之縣市數量: {len(regions)}\")\n    print(f\"縣市清單 (前 8 個): {', '.join(regions[:8])} ...\")\n\n    # 測試查詢基隆市或台北市\n    target_region = \"基隆市\" if \"基隆市\" in regions else regions[0]\n    print(f\"\\n查詢特定縣市 [{target_region}] 之預報紀錄：\")\n    sample_df = get_forecast_by_region(target_region)\n    print(sample_df[[\"regionName\", \"validDate\", \"minT\", \"maxT\", \"weatherCondition\", \"rainProbability\"]].to_string(index=False))\n\n    return df\n\n\nif __name__ == \"__main__\":\n    update_weather_pipeline()\n", "components/charts.py": "\"\"\"\ncomponents/charts.py\n氣溫趨勢圖表繪製模組 (現代風格視覺化升級版)\n使用 Plotly 繪製具備漸層填充、平滑微光折線與現代字體之圖表\n\"\"\"\n\nimport pandas as pd\nimport plotly.graph_objects as go\nfrom typing import List\n\n\nMODERN_FONT = \"'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif\"\n\n\ndef create_temperature_trend_chart(region_df: pd.DataFrame, region_name: str) -> go.Figure:\n    \"\"\"\n    繪製現代風格最高溫與最低溫折線趨勢圖 (含溫差區間透光漸層)\n    \"\"\"\n    if region_df.empty:\n        fig = go.Figure()\n        fig.update_layout(title=\"暫無該地區預報數據\")\n        return fig\n\n    # 將 validDate 簡化為易讀的時間標籤 (例如：09/23 06:00~18:00)\n    time_labels = []\n    for d in region_df[\"validDate\"]:\n        parts = d.split(\"~\")\n        if len(parts) == 2:\n            start_str = parts[0].strip()[5:16]  # MM-DD HH:MM\n            end_str = parts[1].strip()[11:16]    # HH:MM\n            time_labels.append(f\"{start_str} ~ {end_str}\")\n        else:\n            time_labels.append(d)\n\n    fig = go.Figure()\n\n    # 最低溫折線 (青藍色底層線)\n    fig.add_trace(\n        go.Scatter(\n            x=time_labels,\n            y=region_df[\"minT\"],\n            mode=\"lines+markers+text\",\n            name=\"最低溫 (MinT)\",\n            text=[f\"<b>{val}°C</b>\" for val in region_df[\"minT\"]],\n            textposition=\"bottom center\",\n            textfont=dict(family=MODERN_FONT, size=12, color=\"#0284C7\"),\n            line=dict(color=\"#0EA5E9\", width=3, shape=\"spline\"),\n            marker=dict(\n                size=10,\n                color=\"#0EA5E9\",\n                line=dict(color=\"#FFFFFF\", width=2.5),\n            ),\n            hovertemplate=\"<b>%{x}</b><br>最低溫: <span style='color:#0EA5E9;font-weight:bold;'>%{y}°C</span><extra></extra>\",\n        )\n    )\n\n    # 最高溫折線 (暖紅亮橙色，並在兩線之間填充柔和藍紫漸層色塊)\n    fig.add_trace(\n        go.Scatter(\n            x=time_labels,\n            y=region_df[\"maxT\"],\n            mode=\"lines+markers+text\",\n            name=\"最高溫 (MaxT)\",\n            text=[f\"<b>{val}°C</b>\" for val in region_df[\"maxT\"]],\n            textposition=\"top center\",\n            textfont=dict(family=MODERN_FONT, size=12, color=\"#E11D48\"),\n            line=dict(color=\"#F43F5E\", width=3.5, shape=\"spline\"),\n            fill=\"tonexty\",  # 填滿最低溫與最高溫之間的溫差區間\n            fillcolor=\"rgba(14, 165, 233, 0.08)\",\n            marker=dict(\n                size=11,\n                color=\"#F43F5E\",\n                line=dict(color=\"#FFFFFF\", width=2.5),\n            ),\n            hovertemplate=\"<b>%{x}</b><br>最高溫: <span style='color:#F43F5E;font-weight:bold;'>%{y}°C</span><extra></extra>\",\n        )\n    )\n\n    # 現代極簡排版設定\n    fig.update_layout(\n        title={\n            \"text\": f\"📈 <b>{region_name}</b> 氣溫預測區間與走勢分析\",\n            \"x\": 0.03,\n            \"y\": 0.95,\n            \"xanchor\": \"left\",\n            \"font\": {\"family\": MODERN_FONT, \"size\": 17, \"color\": \"#0F172A\"},\n        },\n        font=dict(family=MODERN_FONT),\n        xaxis=dict(\n            title=\"\",\n            tickangle=-10,\n            showgrid=True,\n            gridcolor=\"#F1F5F9\",\n            linecolor=\"#E2E8F0\",\n            tickfont=dict(size=12, color=\"#64748B\"),\n        ),\n        yaxis=dict(\n            title=\"溫度 (°C)\",\n            showgrid=True,\n            gridcolor=\"#F1F5F9\",\n            linecolor=\"#E2E8F0\",\n            tickfont=dict(size=12, color=\"#64748B\"),\n            range=[\n                max(0, region_df[\"minT\"].min() - 3),\n                region_df[\"maxT\"].max() + 3.5,\n            ],\n        ),\n        legend=dict(\n            orientation=\"h\",\n            yanchor=\"bottom\",\n            y=1.02,\n            xanchor=\"right\",\n            x=1,\n            font=dict(size=12, color=\"#475569\"),\n            bgcolor=\"rgba(255, 255, 255, 0.8)\",\n        ),\n        hoverlabel=dict(\n            bgcolor=\"#0F172A\",\n            font_size=13,\n            font_family=MODERN_FONT,\n            font_color=\"#FFFFFF\",\n            bordercolor=\"rgba(255, 255, 255, 0.15)\",\n        ),\n        plot_bgcolor=\"#FFFFFF\",\n        paper_bgcolor=\"#FFFFFF\",\n        margin=dict(l=35, r=35, t=55, b=35),\n        hovermode=\"x unified\",\n        height=370,\n    )\n\n    return fig\n\n\ndef create_multi_region_comparison_chart(all_df: pd.DataFrame, region_names: List[str]) -> go.Figure:\n    \"\"\"\n    現代風格多縣市氣溫對比折線圖\n    \"\"\"\n    fig = go.Figure()\n    # 現代和諧色彩調色盤 (Sky, Rose, Emerald, Amber, Violet, Pink)\n    palette = [\"#0284C7\", \"#E11D48\", \"#10B981\", \"#F59E0B\", \"#8B5CF6\", \"#EC4899\"]\n\n    for idx, reg in enumerate(region_names):\n        sub_df = all_df[all_df[\"regionName\"] == reg].reset_index(drop=True)\n        if sub_df.empty:\n            continue\n\n        time_labels = []\n        for d in sub_df[\"validDate\"]:\n            parts = d.split(\"~\")\n            if len(parts) == 2:\n                time_labels.append(f\"{parts[0].strip()[5:16]}~{parts[1].strip()[11:16]}\")\n            else:\n                time_labels.append(d)\n\n        color = palette[idx % len(palette)]\n        fig.add_trace(\n            go.Scatter(\n                x=time_labels,\n                y=sub_df[\"maxT\"],\n                mode=\"lines+markers\",\n                name=f\"{reg}\",\n                line=dict(color=color, width=3.2, shape=\"spline\"),\n                marker=dict(size=8, color=color, line=dict(color=\"#FFFFFF\", width=1.5)),\n                hovertemplate=f\"<b>{reg}</b>: %{{y}}°C<extra></extra>\",\n            )\n        )\n\n    fig.update_layout(\n        title={\n            \"text\": \"📊 <b>跨縣市最高氣溫預報綜合對比</b>\",\n            \"x\": 0.03,\n            \"y\": 0.95,\n            \"xanchor\": \"left\",\n            \"font\": {\"family\": MODERN_FONT, \"size\": 17, \"color\": \"#0F172A\"},\n        },\n        font=dict(family=MODERN_FONT),\n        xaxis=dict(title=\"\", tickangle=-10, showgrid=True, gridcolor=\"#F1F5F9\", tickfont=dict(size=12, color=\"#64748B\")),\n        yaxis=dict(title=\"最高氣溫 (°C)\", showgrid=True, gridcolor=\"#F1F5F9\", tickfont=dict(size=12, color=\"#64748B\")),\n        legend=dict(\n            orientation=\"h\",\n            yanchor=\"bottom\",\n            y=1.02,\n            xanchor=\"right\",\n            x=1,\n            font=dict(size=12, color=\"#475569\"),\n            bgcolor=\"rgba(255,255,255,0.8)\",\n        ),\n        hoverlabel=dict(\n            bgcolor=\"#0F172A\",\n            font_size=13,\n            font_family=MODERN_FONT,\n            font_color=\"#FFFFFF\",\n        ),\n        plot_bgcolor=\"#FFFFFF\",\n        paper_bgcolor=\"#FFFFFF\",\n        margin=dict(l=35, r=35, t=55, b=35),\n        hovermode=\"x unified\",\n        height=380,\n    )\n    return fig\n", "components/map_view.py": "\"\"\"\ncomponents/map_view.py\n台灣氣象地圖視覺化模組 (現代風格視覺化升級版)\n使用 Folium 繪製具備現代色彩標記、發光圈與精美彈窗之全台天氣地圖\n\"\"\"\n\nimport folium\nimport pandas as pd\nfrom typing import Optional\n\n# 台灣 22 縣市中心地理座標 (緯度 Latitude, 經度 Longitude)\nTAIWAN_COORDINATES = {\n    \"基隆市\": (25.1276, 121.7392),\n    \"臺北市\": (25.0330, 121.5654),\n    \"新北市\": (25.0170, 121.4628),\n    \"桃園市\": (24.9936, 121.3010),\n    \"新竹市\": (24.8138, 120.9675),\n    \"新竹縣\": (24.8387, 121.0177),\n    \"苗栗縣\": (24.5602, 120.8214),\n    \"臺中市\": (24.1477, 120.6736),\n    \"彰化縣\": (24.0518, 120.5161),\n    \"南投縣\": (23.9609, 120.9719),\n    \"雲林縣\": (23.7092, 120.4313),\n    \"嘉義市\": (23.4800, 120.4491),\n    \"嘉義縣\": (23.4518, 120.2559),\n    \"臺南市\": (22.9997, 120.2270),\n    \"高雄市\": (22.6273, 120.3014),\n    \"屏東縣\": (22.5519, 120.5487),\n    \"宜蘭縣\": (24.7021, 121.7377),\n    \"花蓮縣\": (23.9871, 121.6016),\n    \"臺東縣\": (22.7583, 121.1444),\n    \"澎湖縣\": (23.5711, 119.5793),\n    \"金門縣\": (24.4493, 118.3766),\n    \"連江縣\": (26.1505, 119.9499),\n}\n\n\ndef get_temperature_color(max_t: Optional[float]) -> str:\n    \"\"\"依據最高溫決定地圖標記現代漸層色 (Vibrant Modern Palette)\"\"\"\n    if max_t is None:\n        return \"#94A3B8\"\n    if max_t >= 33:\n        return \"#F43F5E\"  # 豔紅 (高溫警戒)\n    elif max_t >= 28:\n        return \"#F59E0B\"  # 琥珀金 (溫暖宜人)\n    elif max_t >= 24:\n        return \"#10B981\"  # 翠綠 (適溫舒適)\n    elif max_t >= 20:\n        return \"#0EA5E9\"  # 蔚藍 (清爽涼快)\n    else:\n        return \"#6366F1\"  # 靛藍 (偏冷防寒)\n\n\ndef create_taiwan_weather_map(df: pd.DataFrame, selected_region: Optional[str] = None) -> folium.Map:\n    \"\"\"\n    步驟 17 & 18 & 19：建立現代風格台灣互動氣象地圖\n    \"\"\"\n    center_lat, center_lon = 23.8, 121.0\n    \n    if selected_region and selected_region in TAIWAN_COORDINATES:\n        center_lat, center_lon = TAIWAN_COORDINATES[selected_region]\n\n    m = folium.Map(\n        location=[center_lat, center_lon],\n        zoom_start=7 if not selected_region else 8,\n        tiles=\"OpenStreetMap\",\n        control_scale=True,\n    )\n\n    # 取得每個縣市的第一筆（最新時段）預報\n    latest_df = df.groupby(\"regionName\").first().reset_index()\n\n    for _, row in latest_df.iterrows():\n        region = row[\"regionName\"]\n        if region not in TAIWAN_COORDINATES:\n            continue\n\n        lat, lon = TAIWAN_COORDINATES[region]\n        min_t = row.get(\"minT\", \"--\")\n        max_t = row.get(\"maxT\", \"--\")\n        wx = row.get(\"weatherCondition\", \"未知\")\n        pop = row.get(\"rainProbability\", 0)\n        valid_date = row.get(\"validDate\", \"\")\n\n        is_selected = (region == selected_region)\n        color = get_temperature_color(row.get(\"maxT\"))\n\n        # 現代玻璃擬態 Popup 彈跳卡片\n        popup_html = f\"\"\"\n        <div style=\"font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; min-width: 190px; padding: 4px; line-height: 1.5;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid {color}; padding-bottom: 6px; margin-bottom: 8px;\">\n                <span style=\"font-size: 16px; font-weight: 700; color: #0F172A;\">📍 {region}</span>\n                <span style=\"font-size: 11px; background: {color}20; color: {color}; padding: 2px 7px; border-radius: 12px; font-weight: 700;\">{max_t}°C</span>\n            </div>\n            <div style=\"font-size: 13px; color: #334155;\">\n                <p style=\"margin: 3px 0;\">🌤️ <b>預報天氣：</b>{wx}</p>\n                <p style=\"margin: 3px 0;\">🌡️ <b>溫差區間：</b><b style=\"color:#0284C7;\">{min_t}°C</b> ~ <b style=\"color:#E11D48;\">{max_t}°C</b></p>\n                <p style=\"margin: 3px 0;\">💧 <b>降雨機率：</b><b style=\"color:#0369A1;\">{pop}%</b></p>\n                <div style=\"margin-top: 8px; font-size: 11px; color: #94A3B8; border-top: 1px dashed #E2E8F0; padding-top: 4px;\">\n                    {valid_date.split('~')[0].strip() if '~' in valid_date else valid_date}\n                </div>\n            </div>\n        </div>\n        \"\"\"\n\n        # 現代圓形標記\n        folium.CircleMarker(\n            location=[lat, lon],\n            radius=12 if is_selected else 8,\n            color=\"#0F172A\" if is_selected else \"#FFFFFF\",\n            weight=3.5 if is_selected else 2,\n            fill=True,\n            fill_color=color,\n            fill_opacity=0.92 if is_selected else 0.82,\n            tooltip=f\"<b>{region}</b>: {min_t}°C ~ {max_t}°C ({wx})\",\n            popup=folium.Popup(popup_html, max_width=320),\n        ).add_to(m)\n\n    return m\n", "components/ai_advisor.py": "\"\"\"\ncomponents/ai_advisor.py\nAI 天氣顧問與生活決策模組 (對應教學步驟 22：延伸應用與想法)\n根據氣象數據提供智慧穿搭、雨具提醒、戶外活動指標與 AI 播報稿\n\"\"\"\n\nfrom typing import Dict, Any\n\n\ndef generate_weather_advice(\n    region_name: str,\n    min_t: float,\n    max_t: float,\n    weather_condition: str,\n    rain_prob: int,\n) -> Dict[str, Any]:\n    \"\"\"\n    根據氣象要素進行智慧生活決策分析\n    \"\"\"\n    temp_diff = round(max_t - min_t, 1)\n\n    # 1. 穿搭建議 (Clothing Advice)\n    if max_t >= 32:\n        clothing = \"短袖、透氣排汗涼感衣物，戶外活動注意防曬與補充水分。\"\n        clothing_level = \"炎熱防暑\"\n        clothing_color = \"#E11D48\"\n    elif max_t >= 26:\n        if temp_diff >= 6:\n            clothing = f\"白天舒適溫暖可著短袖，早晚溫差達 {temp_diff}°C，建議攜帶薄外套採洋蔥式穿法。\"\n        else:\n            clothing = \"著短袖或薄長袖棉質衣物，體感舒適宜人。\"\n        clothing_level = \"舒適微溫\"\n        clothing_color = \"#059669\"\n    elif max_t >= 20:\n        clothing = \"長袖上衣、針織衫或休閒風衣，體感偏涼。\"\n        clothing_level = \"涼爽舒適\"\n        clothing_color = \"#0284C7\"\n    else:\n        clothing = \"保暖毛衣、防風厚外套或羽絨衣，注意防寒保暖。\"\n        clothing_level = \"偏冷防寒\"\n        clothing_color = \"#6366F1\"\n\n    # 2. 雨具提醒 (Umbrella Advice)\n    if rain_prob >= 70:\n        umbrella = \"降雨機率高，出門務必攜帶長傘或雨衣，提防短延時強降雨。\"\n        umbrella_badge = \"🔴 必帶雨具\"\n    elif rain_prob >= 30:\n        umbrella = \"局部地區有短暫降雨機率，建議隨身攜帶折疊傘以備不時之需。\"\n        umbrella_badge = \"🟡 建議備傘\"\n    else:\n        umbrella = \"降雨機率低，天氣大致穩定，外出不需特別帶傘。\"\n        umbrella_badge = \"🟢 無需帶傘\"\n\n    # 3. 戶外活動與出遊指標 (Outdoor Index)\n    if rain_prob <= 20 and 20 <= max_t <= 31:\n        activity = \"⭐⭐⭐⭐⭐ 天候極佳，非常適合戶外野餐、登山或各項休閒踏青！\"\n        activity_status = \"極度適宜\"\n    elif rain_prob <= 40 and max_t < 34:\n        activity = \"⭐⭐⭐⭐ 天氣大致尚可，可進行戶外散步或輕度運動。\"\n        activity_status = \"尚可適宜\"\n    elif rain_prob > 50:\n        activity = \"⭐⭐ 容易受降雨干擾，建議優先規劃室內藝文、閱讀或購物活動。\"\n        activity_status = \"建議室內活動\"\n    else:\n        activity = \"⭐⭐⭐ 氣溫偏高炎熱，中午前後請盡量避免激烈戶外暴曬。\"\n        activity_status = \"注意防曬補水\"\n\n    # 4. AI 天氣主播播報稿 (Broadcast Script)\n    script = (\n        f\"早安！為您帶來【{region_name}】的即時氣象摘要。\"\n        f\"今日預報為{weather_condition}，氣溫介於 {min_t} 到 {max_t} 度之間，\"\n        f\"早晚溫差約 {temp_diff} 度。降雨機率為百分之 {rain_prob}。\"\n        f\"{'出門記得攜帶雨具！' if rain_prob >= 30 else '整體天候穩定！'}\"\n        f\"祝您今天擁有美好的一天！\"\n    )\n\n    return {\n        \"clothing_advice\": clothing,\n        \"clothing_level\": clothing_level,\n        \"clothing_color\": clothing_color,\n        \"umbrella_advice\": umbrella,\n        \"umbrella_badge\": umbrella_badge,\n        \"activity_advice\": activity,\n        \"activity_status\": activity_status,\n        \"broadcast_script\": script,\n        \"temp_diff\": temp_diff,\n    }\n", "components/alerts.py": "\"\"\"\ncomponents/alerts.py\n極端天氣與防災預警監控模組 (對應教學步驟 22：農業與防災應用)\n自動掃描全台縣市，偵測高溫警報、豪大雨警戒、低溫特報與劇烈溫差\n\"\"\"\n\nimport pandas as pd\nfrom typing import List, Dict, Any\n\n\ndef scan_weather_alerts(all_forecasts_df: pd.DataFrame) -> List[Dict[str, Any]]:\n    \"\"\"\n    掃描全台即時預報，產生各級災害與天氣預警\n    \"\"\"\n    if all_forecasts_df.empty:\n        return []\n\n    # 取得各縣市第一筆最新預報\n    latest_df = all_forecasts_df.groupby(\"regionName\").first().reset_index()\n    alerts = []\n\n    # 1. 偵測高溫警報 (MaxT >= 33°C)\n    high_temp_regions = latest_df[latest_df[\"maxT\"] >= 33]\n    for _, row in high_temp_regions.iterrows():\n        level = \"🔴 橙色高溫警報\" if row[\"maxT\"] >= 35 else \"🟡 黃色高溫提示\"\n        alerts.append({\n            \"type\": \"heat\",\n            \"level\": level,\n            \"region\": row[\"regionName\"],\n            \"title\": f\"{level}：{row['regionName']} 最高溫達 {row['maxT']}°C\",\n            \"description\": \"紫外線強烈，中午前後避免劇烈戶外活動，農作與戶外作業人員請加強防中暑措施。\",\n            \"color\": \"#E11D48\",\n            \"icon\": \"☀️\",\n        })\n\n    # 2. 偵測強降雨機率警報 (PoP >= 60%)\n    heavy_rain_regions = latest_df[latest_df[\"rainProbability\"] >= 60]\n    for _, row in heavy_rain_regions.iterrows():\n        level = \"🌧️ 降雨警戒\" if row[\"rainProbability\"] >= 80 else \"💧 短暫強雨機率偏高\"\n        alerts.append({\n            \"type\": \"rain\",\n            \"level\": level,\n            \"region\": row[\"regionName\"],\n            \"title\": f\"{level}：{row['regionName']} 降雨機率達 {row['rainProbability']}%\",\n            \"description\": f\"天氣現象預測為【{row['weatherCondition']}】，外出務必攜帶雨具，低窪地區留意排水與行車視線安全。\",\n            \"color\": \"#0284C7\",\n            \"icon\": \"🌧️\",\n        })\n\n    # 3. 偵測劇烈日夜溫差 (MaxT - MinT >= 8°C)\n    latest_df[\"temp_diff\"] = latest_df[\"maxT\"] - latest_df[\"minT\"]\n    large_diff_regions = latest_df[latest_df[\"temp_diff\"] >= 8]\n    for _, row in large_diff_regions.iterrows():\n        alerts.append({\n            \"type\": \"diff\",\n            \"level\": \"🌡️ 溫差警戒\",\n            \"region\": row[\"regionName\"],\n            \"title\": f\"🌡️ 日夜溫差警示：{row['regionName']} 溫差達 {round(row['temp_diff'], 1)}°C\",\n            \"description\": f\"最低溫 {row['minT']}°C，最高溫 {row['maxT']}°C，早晚溫差顯著，心血管疾病患者與長輩請留意適時添衣。\",\n            \"color\": \"#D97706\",\n            \"icon\": \"🧥\",\n        })\n\n    return alerts\n", ".streamlit/config.toml": "[theme]\nprimaryColor = \"#0284C7\"\nbackgroundColor = \"#FFFFFF\"\nsecondaryBackgroundColor = \"#F8FAFC\"\ntextColor = \"#0F172A\"\nfont = \"sans serif\"\n\n[server]\nheadless = true\nenableCORS = false\nenableXsrfProtection = false\n\n[browser]\ngatherUsageStats = false\n"};

    stlite.mount({
      requirements: [
        "pandas",
        "plotly",
        "folium",
        "streamlit-folium",
        "python-dotenv",
        "pyodide-http"
      ],
      entrypoint: "app.py",
      files: files
    }, document.getElementById("root")).then(() => {
      const loader = document.getElementById("loading");
      if (loader) {
        loader.style.display = "none";
      }
    });
  </script>
